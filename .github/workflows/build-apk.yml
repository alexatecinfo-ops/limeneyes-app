name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v2.4.5 --yes || true
        git push origin :refs/tags/v2.4.5 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v2.4.5
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.4.5
        name: "LIMEN EYES v2.4.5 - Paleta Oficial Limen, Logotipos e Información Legal"
        body: |
          ### 📱 LIMEN EYES v2.4.5 - Plataforma Oficial de Monitoreo
          - **Paleta Oficial Limen Seguridad**: Dark bunker obsidian (#080B14), índigo (#818CF8 / #4F46E5) y verde esmeralda para estados online.
          - **Logotipo Oficial Vectorial**: Escudo de seguridad y lente biométrica central incorporado en TopBar, Login y sección de Cuenta.
          - **Información Legal y Cumplimiento**: Atribución 'Desarrollada por LIMEN SEGURIDAD', Copyright © 2026, marco normativo Ley N° 25.326 y canales de soporte directo.
          - **Soporte H.265 / HEVC y H.264 nativo**: Reproducción fluida y arquitectura P2P de baja latencia conectada a eyes.limenseguridad.com.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
