name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v2.0.0 --yes || true
        git push origin :refs/tags/v2.0.0 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v2.0.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: "LIMEN EYES v2.0.0 - 100% Native Android (MediaCodec + ExoPlayer)"
        body: |
          ### 📱 LIMEN EYES v2.0.0 - 100% App Nativa (Sin WebView)
          - **0% WebView**: Interfaz y motor de video 100% nativos en Android.
          - **Decodificación por Hardware (`MediaCodec` + `ExoPlayer`)**: Reproducción de video H.264/HEVC directa sobre `SurfaceView` con baja latencia (< 400ms).
          - **Grilla Multicanal (1x1 y 2x2)** estilo EasyViewer / gDMSS con doble toque para maximizar cámara.
          - **Selector de Calidad SD / HD** en tiempo real.
          - **Ingreso Nativo** con usuario Limen y validación directa de cuenta Google.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
