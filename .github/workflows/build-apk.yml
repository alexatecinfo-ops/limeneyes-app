name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Release & Debug)
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v1.1.0 --yes || true
        git push origin :refs/tags/v1.1.0 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v1.1.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: "LIMEN EYES v1.1.0 - Official Release"
        body: |
          ### 📱 LIMEN EYES APK - Versión Oficial 1.1.0
          - Nombre oficial en mayúsculas: **LIMEN EYES**.
          - Nuevo icono oficial con lente de cámara y halo violeta neón.
          - Optimizaciones de aceleración por hardware y pantalla completa sin comportamientos web.
          - Centralización y control de usuarios desde **Limen Admin**.
          - Soporte mejorado para redes dinámicas y conexiones vía Starlink / CGNAT.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}