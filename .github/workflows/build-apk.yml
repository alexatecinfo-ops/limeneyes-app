name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v2.1.0 --yes || true
        git push origin :refs/tags/v2.1.0 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v2.1.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.0
        name: "LIMEN EYES v2.1.0 - Native ExoPlayer Buffer Fix & Anti-Crash"
        body: |
          ### 📱 LIMEN EYES v2.1.0 - 100% App Nativa (Estable)
          - **Corrección de crasheo al iniciar reproducción**: Se ajustaron los umbrales de `DefaultLoadControl` de Media3 ExoPlayer (`minBufferMs: 1500ms >= bufferForPlaybackAfterRebufferMs: 1000ms`), eliminando la excepción `IllegalArgumentException` al abrir las cámaras tras el login.
          - **Grilla Nativa con LinearLayout de doble fila**: Reemplazo de `GridLayout.spec` por pesos nativos para 0 errores de layout.
          - **Carga escalonada de decodificadores por hardware (`MediaCodec`)**.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
