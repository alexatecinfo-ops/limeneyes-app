name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v2.2.0 --yes || true
        git push origin :refs/tags/v2.2.0 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v2.2.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.2.0
        name: "LIMEN EYES v2.2.0 - Interfaz DMSS / EasyViewer, Home con Capturas 16:9 y Selección Manual"
        body: |
          ### 📱 LIMEN EYES v2.2.0 - Estética DMSS / EasyViewer Pro
          - **Pantalla de Inicio (Home) con selección de dispositivo**: No inicia streams automáticamente al abrir la app.
          - **Tarjetas por Dispositivo con Capturas 16:9**: Muestra la última imagen capturada de cada cámara con su etiqueta (`CAM 1`, `CAM 2`, etc.).
          - **Reproductor en Vivo 16:9 bajo demanda**: Toca una cámara para verla en 16:9 individual, o toca el botón `(▶)` del dispositivo para abrir hasta 4 cámaras en simultáneo.
          - **Soporte nativo H.265 (HEVC) + H.264**: Reproducción instantánea tanto en grabadores modernos (Fiorini) como clásicos (Novello).
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
