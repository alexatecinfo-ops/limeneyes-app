name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Release & Debug)
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Release-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "LimenEyes v1.0.0 - EasyViewer Pro Mobile"
        body: |
          ### 📱 LimenEyes APK - Versión Oficial 1.0.0
          - UX / UI inspirada en EasyViewer Pro con distintivos violetas (#a855f7).
          - Control de permisos centralizado por usuario vía Limen Admin.
          - Conexión P2P segura centralizada a través de `https://eyes.limenseguridad.com`.
          - Calidad SD por defecto con selector instantáneo a HD.
          - Capturas instantáneas de fotograma en cliente a 0 ms.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
