name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APKs (Release & Debug)
      run: |
        ./gradlew assembleRelease assembleDebug --stacktrace
        cp app/build/outputs/apk/release/app-release.apk LimenEyes_v2.5.1_beta.apk
        cp app/build/outputs/apk/debug/app-debug.apk LimenEyes_v2.5.1_beta_debug.apk

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v2.5.1-beta --yes || true
        git push origin :refs/tags/v2.5.1-beta || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v2.5.1-beta
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.5.1-beta
        name: "LIMEN EYES v2.5.1-beta - Playback Grabaciones & Performance"
        body: |
          ### 📱 LIMEN EYES v2.5.1-beta - Plataforma Oficial de Monitoreo
          - **Módulo de Grabaciones (Playback HDD)**: Lógica on-demand con regla de tiempo 24h interactiva y selector rápido.
          - **Compilación Release Firmada**: Certificación oficial de seguridad V1/V2 para instalación instantánea sin bloqueos de Play Protect.
        files: |
          LimenEyes_v2.5.1_beta.apk
          LimenEyes_v2.5.1_beta_debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
