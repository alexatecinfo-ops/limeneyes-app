name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v1.3.0 --yes || true
        git push origin :refs/tags/v1.3.0 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v1.3.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.3.0
        name: "LIMEN EYES v1.3.0 - Google & Firebase Auth"
        body: |
          ### 📱 LIMEN EYES v1.3.0 - APK
          - Ingreso nativo y autorización con **Google Sign-In** (Limby / Firebase).
          - Vinculación directa con Limen Admin: permisos y cámaras autorizadas por usuario.
          - Nombre oficial: **LIMEN EYES**.
          - Logo y favdon neón pñrpura oficial.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
