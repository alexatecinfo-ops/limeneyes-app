name: Build LimenEyes APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: LimenEyes-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release tag if exists
      run: |
        gh release delete v2.4.0 --yes || true
        git push origin :refs/tags/v2.4.0 || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release v2.4.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.4.0
        name: "LIMEN EYES v2.4.0 - Detalles del Dispositivo, Modo Lista/Tarjetas, Consola en Vivo y Tipografía Uniforme Limen"
        body: |
          ### 📱 LIMEN EYES v2.4.0 - Experiencia EasyViewer con Identidad Limen Seguridad
          - **Menú Flotante Limen en los 3 puntos (`•••`)**: Reemplazado el cuadro de diálogo genérico de Android por un panel oscuro flotante con iconos vectoriales y opción **Detalles del dispositivo**.
          - **Pantalla "Detalles del dispositivo"**: Muestra chasis DVR/NVR, estado `En línea`, Modelo, `SN de dispositivo`, **Suscripción de alarma multicanal**, **Config. de transmisión (SD/HD)**, **Aceleración P2P / UPnP**, **Enlace DDNS / Limen Cloud** y **Configuración remota de canales**.
          - **Alternador de Vista en Inicio (Tarjetas 16:9 vs. Lista Compacta)**: El icono superior izquierdo permite alternar entre las tarjetas con miniaturas 16:9 y la lista compacta de grabadores.
          - **Vista en Vivo Rediseñada**: Cabecera con acceso directo a Detalles del dispositivo, overlays de canal y tasa de bits (`KB/s`), barra de 5 controles vectoriales (`Pausa`, `[SD/HD]`, `Audio`, `[1/4/9]`, `Pantalla completa`), consola táctil circular y bandeja desplegable de **Mensaje de alarma y eventos**.
          - **Tipografía 100% uniforme**: Fuente y jerarquía visual unificadas en todas las pantallas y modales.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
